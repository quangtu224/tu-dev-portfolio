name: CI/CD

on:
  # CI on pushes to main and on pull requests; deploy only on main (see the deploy job)
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:

# Required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; cancel outdated runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== CI: lint + build =====
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ===== CD: deploy to GitHub Pages (main only, after CI passes) =====
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
